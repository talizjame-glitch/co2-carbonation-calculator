<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CO2 Carbonation Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #eef3f8;
      --card: #fff;
      --text: #1f2937;
      --accent: #1c7ed6;
    }

    .dark {
      --bg: #121826;
      --card: #1f2937;
      --text: #f3f4f6;
      --accent: #60a5fa;
    }

    body {
      margin: 0;
      font-family: Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .head {
      background: linear-gradient(135deg, #203c60, #1c7ed6);
      color: #fff;
      padding: 14px;
      text-align: center;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .card {
      background: var(--card);
      padding: 14px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      box-sizing: border-box;
    }

    .metric {
      background: rgba(128, 128, 128, .08);
      padding: 10px;
      border-radius: 12px;
      margin: 8px 0;
    }

    .value {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .unit {
      font-size: 12px;
      opacity: .8;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      cursor: pointer;
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div class='head'>
    <div class='top'>
      <h2>CO₂ Carbonation Calculator</h2>
      <button class='btn' onclick='document.body.classList.toggle("dark")'>🌙 Dark Mode</button>
    </div>
  </div>

  <div class='wrap'>
    <div class='grid'>
      <div class='card'>
        <label>Remelt (Ton)</label>
        <input id=r value='500'>

        <label>Brix (%)</label>
        <input id=brix value='66'>

        <label>CaO (kg/Ton)</label>
        <input id=cao value='13'>

        <label>Available CaO (%)</label>
        <input id=avail value='100'>

        <label>CO₂ in Flue Gas (%)</label>
        <input id=co2 value='15'>

        <label>Efficiency (%)</label>
        <input id=eta value='80'>
      </div>

      <div class='card'>
        <div class='metric'>CaO ออกฤทธิ์
          <div id=m1 class=value></div>
          <div class=unit>kg</div>
        </div>

        <div class='metric'>CO₂ ตามปฏิกิริยา
          <div id=m2 class=value></div>
          <div class=unit>kg</div>
        </div>

        <div class='metric'>Flue Gas ตามทฤษฎี
          <div id=m3 class=value></div>
          <div class=unit>Nm³</div>
        </div>

        <div class='metric'>Flue Gas ตามประสิทธิภาพ
          <div id=m4 class=value></div>
          <div class=unit>Nm³</div>
        </div>

        <div class='metric'>ของแข็งใน Remelt
          <div id=m5 class=value></div>
          <div class=unit>Ton</div>
        </div>

        <div class='metric'>Available CaO on Brix
          <div id=m6 class=value></div>
          <div class=unit>%</div>
        </div>
      </div>
    </div>

    <div class='card'>
      <canvas id=chart></canvas>
    </div>
  </div>

  <script>
    function fn(v, d = 2) {
      return Number(v).toLocaleString('en-US', {
        minimumFractionDigits: d,
        maximumFractionDigits: d
      });
    }

    function num(v) {
      return +(String(v).replace(/,/g, '')) || 0;
    }

    r.oninput = function () {
      let v = this.value.replace(/,/g, '').replace(/[^\d.]/g, '');
      if (v) this.value = Number(v).toLocaleString('en-US');
    };

    let ch;

    function calc() {
      const MWCO2 = 44.01;
      const VM = 22.414;

      let rem = num(r.value);
      let b = num(brix.value) / 100;
      let ca = num(cao.value);
      let av = num(avail.value) / 100;
      let f = num(co2.value) / 100;
      let e = num(eta.value) / 100;

      let active = rem * ca * av;
      let co2rx = active * 44.01 / 56.08;
      let vol = co2rx / MWCO2 * VM;
      let fg = vol / f;
      let fgEff = fg / e;
      let solids = rem * b;
      let onb = solids ? active / (solids * 1000) * 100 : 0;

      m1.textContent = fn(active);
      m2.textContent = fn(co2rx);
      m3.textContent = fn(fg);
      m4.textContent = fn(fgEff);
      m5.textContent = fn(solids);
      m6.textContent = fn(onb, 4);

      let eff = [60, 70, 80, 90, 100];
      let vals = eff.map(x => fg / (x / 100));

      if (ch) ch.destroy();
      ch = new Chart(chart, {
        type: 'line',
        data: {
          labels: eff,
          datasets: [{
            label: 'Flue Gas (Nm³)',
            data: vals,
            borderColor: '#1c7ed6'
          }]
        }
      });
    }

    document.querySelectorAll('input').forEach(i => i.addEventListener('input', calc));
    calc();
  </script>
</body>
</html>
